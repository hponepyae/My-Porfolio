<div
  class="character-entrance"
  [class.is-exiting]="entranceExiting"
  [attr.aria-hidden]="!entranceVisible"
  [class.is-blackening]="blackoutActive"
  role="dialog"
  aria-modal="true"
  aria-label="Portfolio entrance"
  (pointerdown)="onEntrancePointerDown()"
>
  <div class="character-entrance-stage">
    <svg
      class="entrance-bulb"
      viewBox="0 0 140 230"
      role="button"
      tabindex="0"
      aria-label="Click the bulb to enter the portfolio"
      [attr.aria-disabled]="!bulbReady"
      [class.is-ready]="bulbReady"
      (click)="onBulbActivate()"
      (keydown)="onBulbKeydown($event)"
    >
      <defs>
        <radialGradient id="entranceBulbGlow" cx="50%" cy="48%" r="54%">
          <stop offset="0" stop-color="#fff9bd" stop-opacity="0.96" />
          <stop offset="0.42" stop-color="#ffd84d" stop-opacity="0.35" />
          <stop offset="1" stop-color="#ffd84d" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="entranceBulbGlass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf0" stop-opacity="0.96" />
          <stop offset="0.38" stop-color="#ffe985" stop-opacity="0.95" />
          <stop offset="1" stop-color="#f6a900" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="entranceBulbSocket" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9b5b16" />
          <stop offset="0.48" stop-color="#ffe19a" />
          <stop offset="1" stop-color="#9b5b16" />
        </linearGradient>
        <filter id="entranceBulbBlur" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="4" />
        </filter>
      </defs>
      <path class="bulb-cord" d="M70 0 C69 18 71 36 70 62" />
      <circle class="bulb-halo" cx="70" cy="104" r="63" fill="url(#entranceBulbGlow)" filter="url(#entranceBulbBlur)" />
      <g class="bulb-body" transform="rotate(180 70 115)">
        <path
          id="bulbGlass"
          class="bulb-glass"
          d="M70 62 C43 62 27 82 30 106 C32 125 45 132 48 146 L92 146 C95 132 108 125 110 106 C113 82 97 62 70 62 Z"
        />
        <path class="bulb-highlight" d="M48 81 C39 91 40 106 45 115" />
        <path class="bulb-filament" d="M57 112 L64 99 L70 112 L76 99 L83 112 M64 99 V91 M76 99 V91" />
        <path class="bulb-neck" d="M49 144 H91 V153 H49 Z" />
        <path class="bulb-socket" d="M47 151 H93 V177 C86 183 54 183 47 177 Z" />
        <path class="bulb-thread" d="M48 157 H92 M48 164 H92 M50 171 H90" />
        <path class="bulb-tip" d="M58 178 C59 190 81 190 82 178" />
      </g>
    </svg>

    <div #characterMount class="character-mount" aria-live="polite"></div>
    <div class="entrance-light-wash" aria-hidden="true"></div>

    <div
      #loadingBar
      class="entrance-loader"
      [class.is-complete]="bulbReady"
      role="progressbar"
      aria-label="Loading portfolio entrance"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="entrance-loader-track">
        <div #loadingFill class="entrance-loader-fill"></div>
        <span class="entrance-loader-dot"></span>
      </div>
    </div>

    <p class="bulb-instruction" [class.is-visible]="bulbReady" aria-live="polite">
      <span class="desktop-bulb-instruction">click the bulb</span>
      <span class="mobile-bulb-instruction">touch the bulb</span>
    </p>
  </div>
</div>

<section id="home" class="hero-section">
  <div class="hero-track">
    <div class="hero-pinned">
      <div class="absolute inset-x-0 top-0 h-px bg-white/10 z-40"></div>

      <div class="relative mx-auto w-full h-full max-w-[1600px] px-4 sm:px-8">
        <div class="relative h-full flex items-center justify-center">

          <div
            class="hero-display pointer-events-none absolute inset-0 flex flex-col items-center justify-center select-none z-[5]"
            aria-hidden="true"
          >
            <div
              class="hero-uiux flex w-full items-center justify-center gap-[28px] sm:gap-[30px] md:gap-[40px] lg:gap-[50px] xl:gap-[60px] font-mono font-extrabold uppercase leading-[0.9] text-[#D9D9D9] text-[120px] sm:text-[140px] md:text-[180px] lg:text-[220px] xl:text-[260px]"
              style="filter: drop-shadow(10px 14px 18px rgba(0,0,0,0.55));"
            >
              <span class="relative">
                <span
                  class="absolute right-full mr-[10px] top-1/4 font-sans font-normal normal-case italic text-white text-base sm:text-lg lg:text-xl whitespace-nowrap leading-none"
                  style="transform: translateY(-50%) rotate(-90deg); transform-origin: right center;"
                  aria-hidden="true"
                >Hello I&rsquo;m</span>
                UI
              </span>
              <span>UX</span>
            </div>

            <div
              class="hero-designer -mt-2 sm:-mt-4 md:-mt-6 w-full text-center font-mono font-extrabold uppercase leading-[0.9] text-gold-500 text-[100px] sm:text-[115px] md:text-[150px] lg:text-[185px] xl:text-[220px] tracking-tight"
              style="filter: drop-shadow(10px 14px 18px rgba(0,0,0,0.55));"
            >
              Designer
            </div>
          </div>

          <div
            class="hpone-name"
            aria-hidden="true"
          >
            <img
              src="photo/my%20name.svg"
              alt="Hpone Pyae"
              class="hpone-name-img"
              (load)="onWindowResize()"
            />
          </div>

          <div class="hero-portrait-wrap relative z-20 flex items-end justify-center w-full h-full pt-10 pb-20">
            <div class="hero-portrait-stack">
              <img src="photo/portrait-ghost-yellow.webp" alt="" class="hero-ghost hero-ghost-yellow" aria-hidden="true" />
              <img src="photo/portrait-ghost-orange.webp" alt="" class="hero-ghost hero-ghost-orange" aria-hidden="true" />
              <img src="photo/portrait-ghost-red.webp" alt="" class="hero-ghost hero-ghost-red" aria-hidden="true" />
              <img
                src="photo/my%20photo.png"
                alt="Portrait"
                class="hero-portrait block max-h-[82vh] w-auto object-contain drop-shadow-[0_30px_60px_rgba(0,0,0,0.6)]"
                (load)="onWindowResize()"
              />
            </div>
          </div>

          <div class="hero-intro-panel">
            <div class="hero-intro-id">
              <p class="hero-intro-role">UI/UX Designer</p>
              <p class="hero-intro-name">Hpone Pyae Ko Ko</p>
            </div>

            <p class="hero-intro-copy">
              Crafting digital experiences that are beautiful, intuitive, and
              purposeful &mdash; from concept to pixel-perfect execution.
            </p>

            <a class="hero-intro-link" href="#skills">View Work</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
